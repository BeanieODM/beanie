name: Publish project
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag (for example, 2.2.0)"
        required: true
        type: string
jobs:
  publish_project:
    # Releases are intentionally created only by the project owner.
    if: github.actor == 'roman-right'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git cat-file -e "${RELEASE_TAG}^{tag}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: install flit
        run: python -m pip install flit
      - name: build
        run: flit build
      - name: verify built package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/verify_package_version.py \
            --wheel dist/*.whl \
            --expected "$RELEASE_TAG"
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
